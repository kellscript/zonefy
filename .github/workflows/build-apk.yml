name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar pasta www
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            for f in index.html zonefy.html; do
              if [ -f "$f" ]; then cp "$f" www/index.html; break; fi
            done
          fi
          if [ ! -f www/index.html ]; then
            echo "ERRO: faltou o index.html (ou zonefy.html) no repositorio"
            ls -la
            exit 1
          fi
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZoneFy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
